<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>176 · Panorama político español</title>
<meta name="description" content="Congreso, Senado y elecciones generales del 29-N: cámaras, votaciones, sondeos, propuestas y mapa.">
<meta name="theme-color" content="#111B24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icono.svg" type="image/svg+xml">
<link rel="icon" href="icons/icono-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="176">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan: papel frío y tinta; el único color saturado es el de los partidos.
     Cifras en grotesca condensada (marcador de noche electoral); explicaciones en serif de lectura.
     Guiño propio del tema: el Senado se pinta en sepia, como su papeleta. Una columna, pestañas fijas arriba. */
  --paper:#F3F5F7; --card:#FFFFFF; --ink:#111B24; --ink2:#3F4D5A; --muted:#66737F; --line:#D3DAE0; --line2:#E8ECF0;
  --sepia:#F2E6D3; --sepia-line:#D8C3A0; --focus:#0B62D6; --hdr:#111B24; --hdr-ink:#F3F5F7;
  --ok:#1B7A45; --bad:#B3261E; --warn:#8A5A00; --ok-bg:#E3F3EA; --bad-bg:#FBE9E7; --warn-bg:#FBF0D9; --neu-bg:#E8ECF0;
  --f-d:'Archivo','Arial Narrow',Arial,sans-serif; --f-b:'Literata',Georgia,'Times New Roman',serif;
  --p-PP:#1D84CE; --p-PSOE:#E30613; --p-VOX:#58B526; --p-SUMAR:#D6337A; --p-FA:#D6337A; --p-SDP:#E30613; --p-PODEMOS:#84408A;
  --p-ERC:#E08E00; --p-JUNTS:#10AD9F; --p-BILDU:#93A800; --p-PNV:#2E7D32; --p-BNG:#4F9FE8; --p-CC:#C9A800; --p-UPN:#8246B5;
  --p-COMPROMIS:#E8650A; --p-ADELANTE:#12754F; --p-SALF:#B5562B; --p-OTROS:#8A949E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0E141A; --card:#161F28; --ink:#E9EEF2; --ink2:#C2CCD5; --muted:#8F9CA8; --line:#2C3945; --line2:#222D37;
  --sepia:#2A2319; --sepia-line:#4B3E2B; --focus:#7DB4FF; --hdr:#05090D; --hdr-ink:#E9EEF2;
  --ok:#5FCB8E; --bad:#FF8A80; --warn:#E8B75C; --ok-bg:#173524; --bad-bg:#3B1C1A; --warn-bg:#3A2D12; --neu-bg:#222D37;
  --p-PP:#2B8FD9; --p-PSOE:#EF3340; --p-VOX:#4FA322; --p-SUMAR:#E0447F; --p-FA:#E0447F; --p-SDP:#EF3340; --p-PODEMOS:#A45CAB;
  --p-ERC:#CC8000; --p-JUNTS:#12A8B8; --p-BILDU:#869900; --p-PNV:#3E8E2F; --p-BNG:#3F8FD8; --p-CC:#A88C00; --p-UPN:#9560CC;
  --p-COMPROMIS:#E8650A; --p-ADELANTE:#23967F; --p-SALF:#C2643A; --p-OTROS:#7B8792;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E141A; --card:#161F28; --ink:#E9EEF2; --ink2:#C2CCD5; --muted:#8F9CA8; --line:#2C3945; --line2:#222D37;
  --sepia:#2A2319; --sepia-line:#4B3E2B; --focus:#7DB4FF; --hdr:#05090D; --hdr-ink:#E9EEF2;
  --ok:#5FCB8E; --bad:#FF8A80; --warn:#E8B75C; --ok-bg:#173524; --bad-bg:#3B1C1A; --warn-bg:#3A2D12; --neu-bg:#222D37;
  --p-PP:#2B8FD9; --p-PSOE:#EF3340; --p-VOX:#4FA322; --p-SUMAR:#E0447F; --p-FA:#E0447F; --p-SDP:#EF3340; --p-PODEMOS:#A45CAB;
  --p-ERC:#CC8000; --p-JUNTS:#12A8B8; --p-BILDU:#869900; --p-PNV:#3E8E2F; --p-BNG:#3F8FD8; --p-CC:#A88C00; --p-UPN:#9560CC;
  --p-COMPROMIS:#E8650A; --p-ADELANTE:#23967F; --p-SALF:#C2643A; --p-OTROS:#7B8792;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;text-wrap:balance}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.ui{font-family:var(--f-d)}
.num{font-family:var(--f-d);font-stretch:68%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:.86rem}

/* cabecera */
.top{background:var(--hdr);color:var(--hdr-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.5rem;font-stretch:72%;font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.brand p{margin:4px 0 0;font-family:var(--f-d);font-size:.8rem;opacity:.78}
.helpbtn{flex:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-family:var(--f-d);font-weight:700;font-size:.9rem;cursor:pointer}
.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;padding:0 8px}
.tab{flex:1 1 auto;border:0;background:none;padding:12px 2px 10px;font-family:var(--f-d);font-weight:700;font-size:.84rem;font-stretch:88%;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
main{padding:16px 0 56px}
section[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:14px}

/* piezas */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card.sepia{background:var(--sepia);border-color:var(--sepia-line)}
.card h2{font-size:1.18rem;font-weight:800;font-stretch:90%;line-height:1.2}
.card h3{font-size:1rem;font-weight:700}
.eyebrow{font-family:var(--f-d);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.lead{margin:6px 0 0;color:var(--ink2)}
.hint{margin-top:10px;font-size:.9rem}
.hint summary{font-family:var(--f-d);font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;font-size:.72rem}
.hint p{margin:8px 0 0;padding:10px 12px;background:var(--paper);border-radius:8px;color:var(--ink2)}
.card.sepia .hint p{background:var(--card)}
.src{font-family:var(--f-d);font-size:.76rem;color:var(--muted);margin:12px 0 0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;font-family:var(--f-d);max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-family:var(--f-d);font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.chip:disabled{cursor:default;color:var(--muted);border-style:dashed;opacity:.55}
.sel{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-family:var(--f-d);font-size:.9rem;max-width:100%}
label.fl{font-family:var(--f-d);font-size:.8rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-family:var(--f-d);font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.neu{background:var(--neu-bg);color:var(--ink2)}

/* hemiciclo */
.hemi{display:block;width:100%;max-width:520px;margin:6px auto 0;height:auto}
.hemi circle{stroke:var(--card);stroke-width:.6;cursor:pointer}
.sepia .hemi circle{stroke:var(--sepia)}
.hemi .big{font-family:var(--f-d);font-stretch:66%;font-weight:900;font-size:34px;fill:var(--ink)}
.hemi .cap{font-family:var(--f-d);font-size:9.5px;font-weight:600;fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hemi.dim circle{opacity:.22} .hemi.dim circle.on{opacity:1}

/* barra de bloques */
.bbar{position:relative;display:flex;gap:2px;height:22px;margin-top:22px}
.bbar span{height:100%;min-width:2px;border-radius:2px;cursor:pointer}
.bbar .maj{position:absolute;top:-16px;bottom:-4px;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.bbar .maj b{position:absolute;top:-4px;left:5px;font-family:var(--f-d);font-size:.7rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.blocks{display:grid;gap:8px;margin-top:12px}
.block{border-left:4px solid var(--line);padding:2px 0 2px 10px}
.block b{font-family:var(--f-d);font-weight:800}
.block .n{float:right;font-size:1.15rem}
.block p{margin:2px 0 0;font-size:.9rem;color:var(--ink2)}

/* tabla de partidos */
.ptable{width:100%;border-collapse:collapse;margin-top:12px;font-family:var(--f-d)}
.ptable th{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.ptable th:first-child{text-align:left}
.ptable td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.ptable td:first-child{text-align:left}
.ptable td:not(:first-child),.ptable th{white-space:nowrap}
.ptable tr.click{cursor:pointer}
.ptable tr.click:hover td{background:var(--paper)}
.pn{display:flex;align-items:center;gap:8px;font-weight:700}
.pn small{font-weight:500;color:var(--muted);display:block;font-size:.74rem;line-height:1.2}
.ptable .n{font-size:1.2rem}
.bar{height:8px;border-radius:0 4px 4px 0;min-width:2px}
.barcell{width:34%}
.delta{font-size:.82rem;font-weight:700} .delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.eq{color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* alianzas */
.ali{display:grid;gap:10px;margin-top:12px}
.ali article{border-top:1px solid var(--line2);padding-top:10px}
.ali h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ali p{margin:4px 0 0;color:var(--ink2);font-size:.95rem}
.coin{display:grid;gap:6px;margin-top:12px}
.coin .r{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-family:var(--f-d);font-size:.86rem}
.coin .tr{background:var(--line2);border-radius:4px;height:10px;overflow:hidden}
.coin .tr i{display:block;height:100%;border-radius:0 4px 4px 0}

/* leyes */
.ley{background:var(--card);border:1px solid var(--line);border-radius:10px;border-left-width:5px}
.ley.aprobada{border-left-color:var(--ok)} .ley.rechazada{border-left-color:var(--bad)} .ley.decaida,.ley.sinvotar{border-left-color:var(--warn)}
.ley summary{list-style:none;cursor:pointer;padding:13px 14px;display:grid;gap:6px}
.ley summary::-webkit-details-marker{display:none}
.ley summary h3{font-size:1.02rem;font-weight:800;line-height:1.25}
.ley .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--f-d);font-size:.78rem;color:var(--muted)}
.ley .more{font-family:var(--f-d);font-size:.78rem;font-weight:700;color:var(--muted)}
.ley[open] .more .a{display:none} .ley:not([open]) .more .b{display:none}
.ley .body{padding:0 14px 14px;display:grid;gap:12px}
.ley h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ley p{margin:0}
.votes{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start}
.vrow>b{font-family:var(--f-d);font-size:.8rem;padding-top:3px}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--f-d);font-size:.78rem;font-weight:600;background:var(--card)}
.args{display:grid;gap:8px}
.args div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.92rem}
.links{display:flex;flex-direction:column;gap:2px;font-family:var(--f-d);font-size:.78rem}

/* propuestas */
.prop{display:grid;gap:10px;margin-top:4px}
.prop article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:5px solid var(--line)}
.prop h3{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800}
.prop h3 small{font-weight:500;color:var(--muted);font-size:.8rem}
.prop ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.prop h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}

/* 29-N */
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-size:3rem;line-height:.9}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.92rem}
.kv dt{font-family:var(--f-d);font-weight:700;color:var(--muted);font-size:.8rem;padding-top:2px}
.kv dd{margin:0}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.sum .n{font-size:2.6rem;line-height:1}
.track{position:relative;height:14px;background:var(--line2);border-radius:4px;margin-top:20px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--ink)}
.track .maj{position:absolute;top:-14px;bottom:-4px;border-left:2px dashed var(--ink)}
.track .maj b{position:absolute;top:-5px;left:5px;font-family:var(--f-d);font-size:.7rem;white-space:nowrap}
.vbars{display:grid;gap:9px;margin-top:12px}
.vb{display:grid;grid-template-columns:88px 1fr 92px;gap:8px;align-items:center;font-family:var(--f-d);font-size:.86rem}
.vb .tr{position:relative;height:12px}
.vb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.vb .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.vb .v{text-align:right;font-variant-numeric:tabular-nums}
.ptable td small.ic{display:block;font-size:.66rem;font-weight:600;color:var(--muted);letter-spacing:0;line-height:1.1}
.ptable small.cisc{font-style:italic;white-space:nowrap}
.vb .tr em{position:absolute;left:0;top:-3px;bottom:-3px;border:1.5px dashed var(--muted);border-left:0;border-radius:0 5px 5px 0;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line2) 3px 5px)}
.vb .tr s{position:absolute;top:50%;height:6px;margin-top:-3px;box-sizing:border-box;min-width:4px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/100% 1.5px no-repeat;filter:drop-shadow(0 0 1px var(--card))}
.vb .v small{display:block;font-size:.68rem;font-weight:600;color:var(--muted);line-height:1.25;white-space:nowrap}
.vb .v small.c{font-style:italic}
.cistog{display:inline-flex;align-items:center;gap:6px}
.cistog i{width:16px;height:10px;border:1.5px dashed var(--muted);border-radius:2px;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line2) 3px 5px)}
.polls tr.avg td{background:var(--paper)}
.polls tr.avg td:first-child b{font-weight:800}
.polls tr.cisrow td{font-style:italic;color:var(--muted)}
.polls tr.out td{color:var(--muted)}
.part{margin-top:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);font-family:var(--f-d)}
.part .phead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.part .phead span{font-size:.8rem;font-weight:700;color:var(--muted)}
.polls .pt{display:none} .polls td:first-child small.pt2{white-space:nowrap} .polls td small.pt2 b{color:var(--ink2)}
@media (min-width:520px){ .polls .pt{display:table-cell} .polls small.pt2{display:none} }
.part .tr{position:relative;height:10px;background:var(--line2);border-radius:5px;margin:8px 0 6px}
.part .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink2)}
.part .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.part p{margin:0;font-size:.78rem;color:var(--muted);line-height:1.4}
.polls{width:100%;border-collapse:collapse;font-family:var(--f-d);font-size:.84rem}
.polls th,.polls td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;vertical-align:top}
.polls th{font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-bottom-color:var(--line)}
.polls th:first-child,.polls td:first-child{text-align:left}
.polls td small{display:block;color:var(--muted);font-size:.72rem;white-space:nowrap}
.polls td:first-child small{white-space:normal}
.polls tr.nt td{border-bottom:1px solid var(--line2);padding-top:0;text-align:left;color:var(--muted);font-size:.74rem}
.polls tr.hasnt td{border-bottom:0}
.polls td.l{font-weight:800}
.line{display:block;width:100%;height:auto;margin-top:8px;touch-action:pan-y}
.line text{font-family:var(--f-d);font-size:10px;fill:var(--muted)}
.line .lab{font-weight:700;fill:var(--ink)}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-family:var(--f-d);font-size:.8rem;margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}

/* mapa */
.map{display:block;width:100%;height:auto;margin-top:10px}
.map path,.map circle{stroke:var(--card);stroke-width:.8;cursor:pointer;vector-effect:non-scaling-stroke}
.map .sel{stroke:var(--ink);stroke-width:2.4}
.map .frame{fill:none;stroke:var(--line);stroke-width:1;pointer-events:none}
.grad{height:10px;border-radius:4px;flex:1;min-width:120px}
.pdet h3{font-size:1.25rem;font-weight:800}

/* avisos, diálogos, tooltip */
.note{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:.9rem;color:var(--ink2);background:var(--card)}
.coach{display:flex;gap:10px;align-items:flex-start;background:var(--hdr);color:var(--hdr-ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.92rem}
.coach button{flex:none;border:1.5px solid currentColor;background:none;color:inherit;border-radius:999px;padding:3px 10px;font-family:var(--f-d);font-weight:700;font-size:.8rem;cursor:pointer}
dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--card);color:var(--ink);width:min(680px,calc(100% - 24px));max-height:calc(100% - 32px)}
dialog::backdrop{background:rgba(8,12,16,.55)}
.dlg{padding:18px;display:grid;gap:14px}
.dlg header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dlg h2{font-size:1.35rem;font-weight:900;font-stretch:80%}
.dlg h3{font-size:.95rem;font-weight:800;margin-top:6px}
.dlg ul,.dlg ol{margin:6px 0 0;padding-left:20px;display:grid;gap:6px}

<script>
/* Estimación provincial: reparte la media nacional de sondeos entre las 52 circunscripciones
   a partir del resultado de 2023 y aplica D'Hondt con barrera del 3 %. */
function peModel(PROV, media) {
  var AND = '01', CAT = '09', VAL = '17', BAL = '04', CAN = '05';
  var codes = Object.keys(PROV), VT = 0;
  codes.forEach(function (c) { VT += PROV[c].V; });
  function b(c, k) { return PROV[c].v[k] || 0; }
  // base de cada candidatura de 2026 en cada provincia (a partir de 2023)
  var BASE = {
    PP: function (c) { return b(c, 'PP') + b(c, 'UPN'); },
    PSOE: function (c) { return b(c, 'PSOE'); },
    VOX: function (c) { return b(c, 'VOX'); },
    FA: function (c) { return b(c, 'SUMAR'); },
    PODEMOS: function (c) { var ca = PROV[c].ca; return (ca === CAT || ca === VAL || ca === BAL || ca === CAN) ? 0 : b(c, 'SUMAR'); },
    ADELANTE: function (c) { return PROV[c].ca === AND ? b(c, 'SUMAR') : 0; },
    ERC: function (c) { return b(c, 'ERC'); }, JUNTS: function (c) { return b(c, 'JUNTS'); },
    BILDU: function (c) { return b(c, 'BILDU'); }, PNV: function (c) { return b(c, 'PNV'); },
    BNG: function (c) { return b(c, 'BNG'); }, CC: function (c) { return b(c, 'CC'); },
    SALF: function () { return 1; }
  };
  var BLEND = { PP: 1, PSOE: 1, VOX: 1 };
  var est = {}, tot = {};
  codes.forEach(function (c) { est[c] = { v: {}, s: {} }; });
  Object.keys(BASE).forEach(function (k) {
    var T = media[k]; if (T == null) return;
    var B = 0; codes.forEach(function (c) { B += BASE[k](c) * PROV[c].V / VT; });
    if (B <= 0) return;
    codes.forEach(function (c) {
      var base = BASE[k](c), prop = base * T / B, v = prop;
      if (BLEND[k]) v = Math.max(0, 0.5 * prop + 0.5 * (base + (T - B)));
      if (base > 0 || k === 'SALF') est[c].v[k] = v;
    });
  });
  codes.forEach(function (c) {
    var e = est[c], sum = 0, k;
    for (k in e.v) sum += e.v[k];
    if (sum > 97) for (k in e.v) e.v[k] = e.v[k] * 97 / sum;
    // D'Hondt
    var q = [], n = PROV[c].e26;
    for (k in e.v) if (e.v[k] >= 3) for (var i = 1; i <= n; i++) q.push([e.v[k] / i, k]);
    q.sort(function (a, b2) { return b2[0] - a[0]; });
    q.slice(0, n).forEach(function (x) { e.s[x[1]] = (e.s[x[1]] || 0) + 1; });
    for (k in e.v) e.v[k] = Math.round(e.v[k] * 10) / 10;
    for (k in e.s) tot[k] = (tot[k] || 0) + e.s[k];
    var best = null; for (k in e.v) if (best === null || e.v[k] > e.v[best]) best = k; e.w = best;
  });
  return { prov: est, total: tot };
}

(function(){
'use strict';
var PE = window.PE || {};
if(!PE.contenido || !PE.sondeos || !PE.prov || !PE.mapa){
  document.querySelector('main').innerHTML = '<p class="err">No se han podido cargar los datos de la página. Recarga; si sigue igual, pide a Claude que revise los archivos de datos del artefacto.</p>';
  return;
}
var C = PE.contenido, S = PE.sondeos, PROV = PE.prov, MAPA = PE.mapa, CCAA = PE.ccaa;
// La media que usa toda la web es propia (ver mediaPropia); la de Demócrata queda como referencia en DEM.
var DEM = S.media, MP = mediaPropia(S.lista || []), CIS = (S.lista || []).filter(function(p){ return p.cis; })[0] || null;
if(MP) S.media = { voto: MP.voto, escanos: MP.escanos, participacion: DEM.participacion };
var MS = mediaSenado(S.senado);
var EST = peModel(PROV, S.media.voto);
var V23 = { PP:33.1, PSOE:31.7, VOX:12.4, FA:12.3, ERC:1.9, JUNTS:1.6, BILDU:1.4, PNV:1.1, BNG:0.6, CC:0.5 };
var MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nf(n, d){ return Number(n).toLocaleString('es-ES', {minimumFractionDigits:d||0, maximumFractionDigits:d==null?1:d}); }
function fecha(iso, largo){ var p = iso.split('-'); return (+p[2]) + (largo ? ' de ' + MESL[p[1]-1] + ' de ' + p[0] : ' ' + MES[p[1]-1] + ' ' + p[0]); }
function P(id){ return C.partidos[id] || { c:id, n:id }; }
var COLORS = {PP:1,PSOE:1,VOX:1,SUMAR:1,FA:1,SDP:1,PODEMOS:1,ERC:1,JUNTS:1,BILDU:1,PNV:1,BNG:1,CC:1,UPN:1,COMPROMIS:1,ADELANTE:1,SALF:1};
function col(id){ return 'var(--p-' + (COLORS[id] ? id : 'OTROS') + ')'; }
function lab(id, labels){ return labels && labels[id] ? labels[id].split(' (')[0] : P(id).c; }
function ord(ids){ return ids.slice().sort(function(a,b){ return C.orden.indexOf(a) - C.orden.indexOf(b); }); }
function bySeats(o){ return Object.keys(o).sort(function(a,b){ return o[b]-o[a] || C.orden.indexOf(a)-C.orden.indexOf(b); }); }
function sum(o, ids){ var t=0; (ids||Object.keys(o)).forEach(function(k){ t += o[k]||0; }); return t; }
function dot(id){ return '<i class="dot" style="background:' + col(id) + '"></i>'; }
function link(f){ return '<a href="' + esc(f.u) + '" target="_blank" rel="noopener">' + esc(f.t) + '</a>'; }
function hint(t){ return '<details class="hint"><summary>Cómo leerlo</summary><p>' + t + '</p></details>'; }
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ---------- media propia de sondeos ----------
   Última encuesta de cada encuestadora (S.lista), sin el CIS y sin las que no publican muestra.
   Cada una pesa según su número de entrevistas. Intervalo de confianza del 95 % de la media a partir de
   la dispersión entre encuestas: SE² = varianza ponderada / (n_efectivo − 1), n_efectivo = (Σw)² / Σw². */
function escMedio(s){ var m = String(s).match(/^(\d+)(?:-(\d+))?$/); return m ? (+m[1] + +(m[2] || m[1])) / 2 : null; }
function wstats(pts){
  var W = 0, W2 = 0, m = 0, v = 0;
  pts.forEach(function(p){ W += p.w; W2 += p.w * p.w; m += p.w * p.x; }); m /= W;
  pts.forEach(function(p){ v += p.w * (p.x - m) * (p.x - m); }); v /= W;
  var neff = W * W / W2, se = neff > 1 ? Math.sqrt(v / (neff - 1)) : 0;
  return { m: m, lo: m - 1.96 * se, hi: m + 1.96 * se, n: pts.length };
}
function mediaPropia(L){
  var ps = L.filter(function(p){ return !p.cis && p.n > 0 && p.v; });
  // Hace falta que haya encuestas con todos los partidos: si no, la web usa la media de Demócrata.
  var completas = ps.filter(function(p){ return Object.keys(p.v).length >= 8; });
  var conEsc = ps.filter(function(p){ if(!p.e) return false; var t = 0; Object.keys(p.e).forEach(function(k){ t += escMedio(p.e[k]) || 0; }); return t >= 340 && t <= 360; });
  if(ps.length < 3 || completas.length < 3 || conEsc.length < 3) return null;
  var voto = {}, icVoto = {}, raw = {}, icRaw = {}, kv = {}, ke = {}, N = 0;
  ps.forEach(function(p){ N += p.n; Object.keys(p.v).forEach(function(k){ kv[k] = 1; }); if(p.e) Object.keys(p.e).forEach(function(k){ ke[k] = 1; }); });
  Object.keys(kv).forEach(function(k){
    var s = wstats(ps.filter(function(p){ return p.v[k] != null; }).map(function(p){ return { x: p.v[k], w: p.n }; }));
    voto[k] = Math.round(s.m * 10) / 10; icVoto[k] = s.n >= 3 ? [Math.max(0, s.lo), s.hi] : null;
  });
  // Escaños: solo encuestas con el reparto completo (sus escaños suman unos 350)
  Object.keys(ke).forEach(function(k){
    var pts = conEsc.filter(function(p){ return escMedio(p.e[k]) != null; }).map(function(p){ return { x: escMedio(p.e[k]), w: p.n }; });
    if(!pts.length) return; var s = wstats(pts); raw[k] = s.m; icRaw[k] = s.n >= 3 ? [Math.max(0, s.lo), s.hi] : null;
  });
  // escaños enteros que sumen 350 (restos mayores); el intervalo se escala igual
  var f = 350 / sum(raw), escanos = {}, icEsc = {}, rest = [], asig = 0;
  Object.keys(raw).forEach(function(k){ var x = raw[k] * f; escanos[k] = Math.floor(x); asig += escanos[k]; rest.push([k, x - escanos[k]]);
    if(icRaw[k]) icEsc[k] = [Math.round(icRaw[k][0] * f), Math.round(icRaw[k][1] * f)]; });
  rest.sort(function(a, b){ return b[1] - a[1]; });
  for(var i = 0; i < 350 - asig; i++) escanos[rest[i][0]]++;
  Object.keys(escanos).forEach(function(k){ if(!escanos[k]) delete escanos[k]; });
  var hasta = ps.reduce(function(a, p){ return p.f > a ? p.f : a; }, '');
  return { voto: voto, escanos: escanos, icVoto: icVoto, icEsc: icEsc, polls: ps, N: N, hasta: hasta };
}
/* Senado: media ponderada de las estimaciones de los senadores elegidos + los designados por las comunidades (fijos) */
function mediaSenado(Sn){
  if(!Sn || !Sn.lista) return null;
  var ps = Sn.lista.filter(function(p){ return p.n > 0 && p.e; });
  if(ps.length < 2) return null;
  var D = Sn.designados || {}, EL = Sn.electos || 209, keys = {}, N = 0;
  ps.forEach(function(p){ N += p.n; Object.keys(p.e).forEach(function(k){ keys[k] = 1; }); });
  var mids = ps.map(function(p){ var o = {}; Object.keys(keys).forEach(function(k){ o[k] = escMedio(p.e[k]) || 0; }); return o; });
  var stats = function(get){ return wstats(ps.map(function(p, i){ return { x: get(mids[i]), w: p.n }; })); };
  var raw = {}; Object.keys(keys).forEach(function(k){ raw[k] = stats(function(o){ return o[k]; }).m; });
  var f = EL / sum(raw), el = {}, rest = [], asig = 0;
  Object.keys(raw).forEach(function(k){ var x = raw[k] * f; el[k] = Math.floor(x); asig += el[k]; rest.push([k, x - el[k]]); });
  rest.sort(function(a, b){ return b[1] - a[1]; });
  for(var i = 0; i < EL - asig; i++) el[rest[i][0]]++;
  var escanos = {}; Object.keys(el).concat(Object.keys(D)).forEach(function(k){ escanos[k] = (el[k] || 0) + (D[k] || 0); });
  Object.keys(escanos).forEach(function(k){ if(!escanos[k]) delete escanos[k]; });
  // intervalos por fila de la tabla (ERC y EH Bildu juntos, como su grupo)
  var icTabla = {}, icEl = {};
  Object.keys(senEst(keys)).forEach(function(g){
    var s = stats(function(o){ return g === 'ERC' ? (o.ERC || 0) + (o.BILDU || 0) : o[g]; }), dg = g === 'ERC' ? (D.ERC || 0) + (D.BILDU || 0) : (D[g] || 0);
    icTabla[g] = [Math.max(0, Math.round(s.lo * f)) + dg, Math.round(s.hi * f) + dg];
  });
  Object.keys(keys).forEach(function(k){ var s = stats(function(o){ return o[k]; }); icEl[k] = [Math.max(0, s.lo * f), s.hi * f]; });
  var hasta = ps.reduce(function(a, p){ return p.f > a ? p.f : a; }, '');
  return { escanos: escanos, electos: el, icTabla: icTabla, icEl: icEl, polls: ps, N: N, hasta: hasta };
}
function resumenSenado(){
  var E = MS.escanos, pv = (E.PP || 0) + (E.VOX || 0), D = S.senado.designados || {};
  return esc('El PP tendría ' + E.PP + ' senadores (' + MS.electos.PP + ' elegidos el 29-N y ' + (D.PP || 0) + ' designados) y el Senado de Progreso, ' + (E.SDP || 0) + '. PP y Vox sumarían ' + pv + '; la mayoría absoluta está en ' + S.senado.mayoria + '.');
}
function tablaSenado(){
  var K = ['PP','SDP','VOX'];
  var fila = function(nom, sub, cls, get){ return '<tr class="' + cls + '"><td><b>' + esc(nom) + '</b>' + sub + '</td>' + K.map(function(k){ return '<td style="white-space:nowrap">' + get(k) + '</td>'; }).join('') + '</tr>'; };
  var rows = fila('Media ponderada', '<small>Elegidos el 29-N</small>', 'avg', function(k){ var ic = MS.icEl[k]; return '<b class="num">' + (MS.electos[k] || 0) + '</b>' + (ic ? '<small>' + Math.round(ic[0]) + '–' + Math.round(ic[1]) + '</small>' : ''); });
  rows += S.senado.lista.map(function(p){ var pe = p.n > 0 && MS.polls.indexOf(p) >= 0 ? p.n / MS.N : null;
    return fila(p.i, '<small>' + esc(p.m) + '</small><small>' + fecha(p.f).replace(/ \d{4}$/, '') + (p.n ? ' · ' + nf(p.n, 0) + ' entr.' : '') + '</small><small>' + (pe != null ? 'Peso: ' + nf(100 * pe, 0) + ' %' : 'Sin peso') + '</small>', pe == null ? 'out' + (p.nota ? ' hasnt' : '') : (p.nota ? 'hasnt' : ''), function(k){ return esc(String(p.e[k] || '—').replace('-', '–')); }) + (p.nota ? '<tr class="nt"><td colspan="4">' + esc(p.nota) + '</td></tr>' : ''); }).join('');
  return '<div class="tscroll" style="margin-top:8px"><table class="polls"><thead><tr><th>Encuestadora</th><th>PP</th><th>SDP</th><th>Vox</th></tr></thead><tbody>' + rows + '</tbody></table></div><p class="src">Senadores elegidos en las urnas (209), sin los designados. SDP es Senado de Progreso (PSOE y Frente Amplio); el PP incluye a UPN.</p>';
}
function pesoDe(p){ return MP && !p.cis && p.n > 0 && MP.polls.indexOf(p) >= 0 ? p.n / MP.N : null; }

/* ---------- hemiciclo ---------- */
function hemi(escanos, center, cap, labels){
  var ids = ord(Object.keys(escanos).filter(function(k){ return escanos[k] > 0; }));
  var total = sum(escanos, ids), rows = total > 300 ? 9 : total > 200 ? 8 : 6;
  var W = 360, H = 192, cx = W/2, cy = H - 8, r0 = 62, r1 = 172, dr = (r1 - r0)/(rows - 1), i, j;
  var radii = [], sr = 0; for(i=0;i<rows;i++){ radii.push(r0 + i*dr); sr += r0 + i*dr; }
  var counts = radii.map(function(r){ return Math.round(total*r/sr); });
  var diff = total - counts.reduce(function(a,b){return a+b;},0); counts[rows-1] += diff;
  var pos = [];
  for(i=0;i<rows;i++) for(j=0;j<counts[i];j++){ var t = (j+0.5)/counts[i]; pos.push({ t:t, r:radii[i] }); }
  pos.sort(function(a,b){ return a.t - b.t || a.r - b.r; });
  var seats = []; ids.forEach(function(id){ for(var k=0;k<escanos[id];k++) seats.push(id); });
  var rad = Math.min(dr*0.43, Math.PI*r0/counts[0]*0.43), out = '';
  pos.forEach(function(p, k){ var a = Math.PI*(1 - p.t), id = seats[k];
    out += '<circle cx="' + (cx + p.r*Math.cos(a)).toFixed(1) + '" cy="' + (cy - p.r*Math.sin(a)).toFixed(1) + '" r="' + rad.toFixed(1) + '" data-p="' + id + '" style="fill:' + col(id) + '" data-tip="' + esc(lab(id, labels) + ' · ' + escanos[id] + (escanos[id]===1?' escaño':' escaños')) + '"/>'; });
  return '<svg class="hemi" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Hemiciclo: ' + esc(ids.map(function(id){ return lab(id, labels) + ' ' + escanos[id]; }).join(', ')) + '">' + out +
    '<text class="big" x="' + cx + '" y="' + (cy - 14) + '" text-anchor="middle">' + esc(center) + '</text><text class="cap" x="' + cx + '" y="' + (cy - 1) + '" text-anchor="middle">' + esc(cap) + '</text></svg>';
}
function wireHemi(root){
  $$('.hemi', root).forEach(function(svg){
    svg.addEventListener('pointerover', function(e){ var p = e.target.getAttribute && e.target.getAttribute('data-p'); if(!p) return;
      svg.classList.add('dim'); $$('circle', svg).forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-p') === p); }); });
    svg.addEventListener('pointerleave', function(){ svg.classList.remove('dim'); });
  });
}
function ptable(escanos, opts){
  opts = opts || {}; var ids = bySeats(escanos), max = escanos[ids[0]] || 1, base = opts.base;
  var head = '<tr><th>Fuerza</th>' + (base ? '<th>Hoy</th>' : '') + '<th>' + (opts.col || 'Escaños') + '</th>' + (base ? '<th>Cambio</th>' : '<th class="barcell"><span class="muted"></span></th>') + '</tr>';
  if(opts.cis) Object.keys(opts.cis).forEach(function(k){ if(escanos[k] == null && escMedio(opts.cis[k])) ids.push(k); });
  var rows = ids.map(function(id){
    var n = escanos[id] || 0, lab = opts.labels && opts.labels[id], extra = '', ic = opts.ic && opts.ic[id];
    if(base){ var b = opts.baseMap ? opts.baseMap(id) : (base[id]||0), d = n - b;
      extra = '<td class="muted">' + (b==null?'—':b) + '</td><td class="n num">' + n + (ic ? '<small class="ic">' + ic[0] + '–' + ic[1] + '</small>' : '') + (opts.cis ? '<small class="ic cisc">CIS ' + (opts.cis[id] != null ? esc(String(opts.cis[id]).replace('-', '–')) : '—') + '</small>' : '') + '</td><td class="delta ' + (b==null?'eq':d>0?'up':d<0?'down':'eq') + '">' + (b==null?'nuevo':d>0?'▲ +'+d:d<0?'▼ −'+(-d):'=') + '</td>';
    } else extra = '<td class="n num">' + n + '</td><td class="barcell"><div class="bar" style="width:' + (100*n/max).toFixed(1) + '%;background:' + col(id) + '"></div></td>';
    return '<tr class="' + (opts.noclick?'':'click') + '" data-partido="' + id + '"' + (opts.noclick?'':' tabindex="0"') + '><td><span class="pn">' + dot(id) + '<span>' + esc(lab ? lab.split(' (')[0] : P(id).c) + (lab && lab.indexOf(' (')>0 ? '<small>' + esc(lab.slice(lab.indexOf(' (')+2, -1)) + '</small>' : '') + '</span></span></td>' + extra + '</tr>';
  }).join('');
  return '<div class="tscroll"><table class="ptable"><thead>' + head + '</thead><tbody>' + rows + '</tbody></table></div>';
}
function bbar(cam, labels){
  var segs = '', total = cam.total;
  cam.bloques.forEach(function(b){ ord(b.p).forEach(function(id){ var n = cam.esc[id]; if(!n) return;
    segs += '<span style="flex:' + n + ' ' + n + ' 0;background:' + col(id) + '" data-tip="' + esc(lab(id, labels) + ' · ' + n) + '"></span>'; }); });

/* ---------- MAPA ---------- */
var mMode = 'est', mColor = 'win', mSel = '28';
function provData(code){
  var p = PROV[code];
  if(mMode === 'r23'){ var v = {}, k; for(k in p.v) v[k === 'SUMAR' ? 'FA' : k] = p.v[k]; var s = {}; for(k in p.s) s[k === 'SUMAR' ? 'FA' : k] = p.s[k]; var w = Object.keys(v).sort(function(a,b){ return v[b]-v[a]; })[0]; return { v:v, s:s, w:w, e:p.e23 }; }
  if(mMode === 'r26' && S.resultado && S.resultado.prov && S.resultado.prov[code]){ var r = S.resultado.prov[code]; return { v:r.v, s:r.s, w:Object.keys(r.v).sort(function(a,b){ return r.v[b]-r.v[a]; })[0], e:p.e26 }; }
  var e = EST.prov[code]; return { v:e.v, s:e.s, w:e.w, e:p.e26 };
}
function renderMapa(){
  var el = $('#s-mapa'), has26 = !!(S.resultado && S.resultado.prov), codes = Object.keys(PROV).sort(function(a,b){ return PROV[a].n.localeCompare(PROV[b].n, 'es'); });

  var titulo = mMode === 'r23' ? 'Resultado de las generales de 2023' : mMode === 'r26' ? 'Resultado del 29-N' : 'Estimación con los sondeos de hoy';
  var maxS = 0; if(mColor !== 'win') codes.forEach(function(c){ maxS = Math.max(maxS, provData(c).v[mColor] || 0); });
  var wins = {}, shapes = '';
  codes.forEach(function(c){ var d = provData(c), g = MAPA.prov[c], fill, op = 1; wins[d.w] = (wins[d.w]||0) + 1;
    if(mColor === 'win') fill = col(d.w); else { fill = col(mColor); op = d.v[mColor] ? (0.12 + 0.88*d.v[mColor]/maxS) : 0.04; }
    var tip = PROV[c].n + ' · ' + d.e + ' esc.\n' + bySeats(d.s).map(function(k){ return P(k).c + ' ' + d.s[k]; }).join(' · ') + (mColor !== 'win' ? '\n' + P(mColor).c + ': ' + nf(d.v[mColor]||0, 1) + ' %' : '');
    var attrs = ' data-c="' + c + '" class="' + (c === mSel ? 'sel' : '') + '" style="fill:' + fill + ';fill-opacity:' + op.toFixed(2) + '" data-tip="' + esc(tip) + '" tabindex="0" role="button" aria-label="' + esc(PROV[c].n) + '"';
    shapes += (g.w < 8 ? '<circle cx="' + g.c[0] + '" cy="' + g.c[1] + '" r="7"' + attrs + '/>' : '<path d="' + g.d + '"' + attrs + '/>'); });
  var legend = mColor === 'win' ? '<div class="legend">' + bySeats(wins).map(function(k){ return '<span>' + dot(k) + esc(P(k).c) + ' gana en ' + wins[k] + '</span>'; }).join('') + '</div>' :
    '<div class="legend" style="align-items:center"><span>0 %</span><span class="grad" style="background:linear-gradient(90deg,transparent,' + col(mColor) + ')"></span><span>' + nf(maxS, 1) + ' %</span></div>';
  el.innerHTML = '<div class="card"><p class="eyebrow">Congreso · 52 circunscripciones</p><h2>' + titulo + '</h2>' +
    '<div class="row" style="margin-top:10px"><div class="seg" role="group" aria-label="Datos del mapa"><button type="button" data-mm="est" aria-pressed="' + (mMode==='est') + '">Sondeos hoy</button><button type="button" data-mm="r23" aria-pressed="' + (mMode==='r23') + '">Resultado 2023</button>' + (has26 ? '<button type="button" data-mm="r26" aria-pressed="' + (mMode==='r26') + '">Resultado 29-N</button>' : '') + '</div>' +
    '<label class="fl">Colorear por<select class="sel" id="mColor"><option value="win">Fuerza más votada</option>' + parts.map(function(k){ return '<option value="' + k + '">% de ' + esc(P(k).c) + '</option>'; }).join('') + '</select></label></div>' +
    '<svg class="map" viewBox="' + (MAPA.vb ? MAPA.vb.join(' ') : '0 0 ' + MAPA.w + ' ' + MAPA.h) + '" role="group" aria-label="Mapa de España por provincias"><path class="frame" d="' + MAPA.border + '"/>' + shapes + '</svg>' + legend +
    (mMode === 'est' ? '<p class="note" style="margin-top:12px"><b class="ui">Estimación propia, no un sondeo.</b> No hay encuestas diarias por provincia: repartimos la media nacional de voto entre las 52 circunscripciones según el resultado de 2023 y aplicamos la ley D’Hondt. En total da ' + bySeats(EST.total).map(function(k){ return P(k).c + ' ' + EST.total[k]; }).join(', ') + '. Puede diferir en algunos escaños de la media de las encuestadoras y fallar en provincias concretas.</p>' : '') +
    hint('Toca una provincia para ver su reparto de votos y escaños abajo. Canarias aparece en un recuadro y Ceuta y Melilla como círculos. Con «Colorear por» puedes ver dónde es más fuerte un partido concreto: cuanto más intenso el color, más voto.') + '</div>' +
    '<div class="card pdet"><label class="fl">Circunscripción<select class="sel" id="mProv">' + codes.map(function(c){ return '<option value="' + c + '">' + esc(PROV[c].n) + '</option>'; }).join('') + '</select></label><div id="pdet"></div></div>' +
    '<div class="card"><details><summary class="ui" style="font-weight:800;cursor:pointer">Ver la tabla de las 52 circunscripciones</summary><div class="tscroll"><table class="polls" style="min-width:460px;margin-top:8px"><thead><tr><th>Circunscripción</th><th>Esc.</th><th style="text-align:left">Reparto: ' + (mMode === 'r23' ? '2023' : mMode === 'r26' ? '29-N' : 'estimación') + '</th></tr></thead><tbody>' +

    '<p class="src">Resultados de 2023: Ministerio del Interior. Escaños por provincia de 2026: Real Decreto de convocatoria (Madrid gana uno y Cádiz pierde uno). Mapa: Instituto Geográfico Nacional.</p></div>';
  $$('[data-mm]', el).forEach(function(b){ b.onclick = function(){ mMode = b.getAttribute('data-mm'); renderMapa(); }; });

function renderProv(){

    list.map(function(id){ var a = v23[id], b = now.v[id];
      return '<tr><td><span class="pn">' + dot(id) + esc(P(id).c) + '</span></td><td class="muted">' + (a != null ? nf(a,1) : '—') + '</td><td class="muted">' + (s23[id] || '·') + '</td><td><b>' + (b != null ? nf(b,1) : '—') + '</b></td><td class="n num">' + ((now.s && now.s[id]) || '·') + '</td></tr>'; }).join('') +
    '</tbody></table></div><p class="src">' + (r26 ? 'Resultado del 29-N.' : '«Hoy» es la estimación propia a partir de la media ' + (MP ? 'ponderada de sondeos hasta el ' + fecha(MP.hasta) : 'de sondeos del ' + fecha(S.actualizado)) + '.') + ' En 2023, Frente Amplio corresponde a Sumar' + (p.v.UPN ? ' y UPN se presentó por separado del PP' : '') + '.</p>';

/* ---------- tooltip, pestañas, arranque ---------- */
var tip = $('#tip');

document.addEventListener('pointermove', function(e){ if(e.target.closest && e.target.closest('#lineSvg')) return; var t = e.target.closest && e.target.closest('[data-tip]'); if(t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else hideTip(); });
document.addEventListener('pointerdown', function(e){ var t = e.target.closest && e.target.closest('[data-tip]'); if(t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else if(!(e.target.closest && e.target.closest('#lineSvg'))) hideTip(); });

var TABS = ['camaras','sondeos','leyes','propuestas','mapa'], RENDER = { camaras:renderCamaras, leyes:renderLeyes, sondeos:renderSondeos, propuestas:renderPropuestas, mapa:renderMapa }, done = {};

  if(!done[tab]){ RENDER[tab](); done[tab] = 1; }
