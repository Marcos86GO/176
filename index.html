:root{
  /* Plan: papel frío y tinta; el único color saturado es el de los partidos.
     Cifras en grotesca condensada (marcador de noche electoral); explicaciones en serif de lectura.
     Guiño propio del tema: el Senado se pinta en sepia, como su papeleta. Una columna, pestañas fijas arriba. */
  --paper:#F3F5F7; --card:#FFFFFF; --ink:#111B24; --ink2:#3F4D5A; --muted:#66737F; --line:#D3DAE0; --line2:#E8ECF0;
  --sepia:#F2E6D3; --sepia-line:#D8C3A0; --focus:#0B62D6; --hdr:#111B24; --hdr-ink:#F3F5F7;
  --ok:#1B7A45; --bad:#B3261E; --warn:#8A5A00; --ok-bg:#E3F3EA; --bad-bg:#FBE9E7; --warn-bg:#FBF0D9; --neu-bg:#E8ECF0;
  --f-d:'Archivo','Arial Narrow',Arial,sans-serif; --f-b:'Literata',Georgia,'Times New Roman',serif;
  --p-PP:#1D84CE; --p-PSOE:#E30613; --p-VOX:#58B526; --p-SUMAR:#D6337A; --p-FA:#D6337A; --p-SDP:#E30613; --p-PODEMOS:#84408A;
  --p-ERC:#E08E00; --p-JUNTS:#10AD9F; --p-BILDU:#93A800; --p-PNV:#2E7D32; --p-BNG:#4F9FE8; --p-CC:#C9A800; --p-UPN:#8246B5;
  --p-COMPROMIS:#E8650A; --p-ADELANTE:#12754F; --p-SALF:#B5562B; --p-OTROS:#8A949E;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){

  --sepia:#2A2319; --sepia-line:#4B3E2B; --focus:#7DB4FF; --hdr:#05090D; --hdr-ink:#E9EEF2;
  --ok:#5FCB8E; --bad:#FF8A80; --warn:#E8B75C; --ok-bg:#173524; --bad-bg:#3B1C1A; --warn-bg:#3A2D12; --neu-bg:#222D37;
  --p-PP:#2B8FD9; --p-PSOE:#EF3340; --p-VOX:#4FA322; --p-SUMAR:#E0447F; --p-FA:#E0447F; --p-SDP:#EF3340; --p-PODEMOS:#A45CAB;
  --p-ERC:#CC8000; --p-JUNTS:#12A8B8; --p-BILDU:#869900; --p-PNV:#3E8E2F; --p-BNG:#3F8FD8; --p-CC:#A88C00; --p-UPN:#9560CC;

  color-scheme:dark;
}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-d);margin:0;text-wrap:balance}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
.ui{font-family:var(--f-d)}
.num{font-family:var(--f-d);font-stretch:68%;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:.86rem}

/* cabecera */
.top{background:var(--hdr);color:var(--hdr-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px}
.brand{flex:1;min-width:0}
.brand h1{font-size:1.5rem;font-stretch:72%;font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.brand p{margin:4px 0 0;font-family:var(--f-d);font-size:.8rem;opacity:.78}
.helpbtn{flex:none;border:1.5px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:6px 14px;font-family:var(--f-d);font-weight:700;font-size:.9rem;cursor:pointer}
.hbtns{flex:none;display:flex;gap:8px}
#btnAprende{display:inline-flex;align-items:center;gap:6px}
#btnAprende svg{width:16px;height:16px;flex:none}
@media (max-width:380px){ .hbtns{gap:6px} .hbtns .helpbtn{padding:6px 10px;font-size:.85rem} #btnAprende svg{display:none} }
.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;padding:0 8px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;border:0;background:none;padding:12px 2px 10px;font-family:var(--f-d);font-weight:700;font-size:.84rem;font-stretch:88%;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs.seis .wrap{padding:0 4px}
.tabs.seis .tab{flex:1 0 auto;padding-left:4px;padding-right:4px;font-size:.8rem;font-stretch:82%}
@media (max-width:400px){ .tabs.seis .wrap{padding:0 2px} .tabs.seis .tab{font-size:.75rem;font-stretch:75%;padding-left:3px;padding-right:3px} .tabs.seis .tab .ldot{width:6px;height:6px;margin-right:3px} }
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab[hidden]{display:none}
main{padding:16px 0 56px}
section[hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:14px}

/* piezas */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card.sepia{background:var(--sepia);border-color:var(--sepia-line)}
.card h2{font-size:1.18rem;font-weight:800;font-stretch:90%;line-height:1.2}
.card h3{font-size:1rem;font-weight:700}
.eyebrow{font-family:var(--f-d);font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.lead{margin:6px 0 0;color:var(--ink2)}
.hint{margin-top:10px;font-size:.9rem}
.hint summary{font-family:var(--f-d);font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;list-style:none}
.hint summary::-webkit-details-marker{display:none}
.hint summary::before{content:"?";display:inline-grid;place-items:center;width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;font-size:.72rem}
.hint p{margin:8px 0 0;padding:10px 12px;background:var(--paper);border-radius:8px;color:var(--ink2)}
.card.sepia .hint p{background:var(--card)}
.src{font-family:var(--f-d);font-size:.76rem;color:var(--muted);margin:12px 0 0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;font-family:var(--f-d);max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.segs3{gap:6px} .segs3 .seg button{padding:7px 8px;font-size:.82rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-family:var(--f-d);font-size:.82rem;font-weight:600;cursor:pointer;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--card)}
.chip:disabled{cursor:default;color:var(--muted);border-style:dashed;opacity:.55}
.sel{border:1.5px solid var(--line);background:var(--card);border-radius:8px;padding:8px 10px;font-family:var(--f-d);font-size:.9rem;max-width:100%}
label.fl{font-family:var(--f-d);font-size:.8rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-family:var(--f-d);font-size:.74rem;font-weight:700;white-space:nowrap}
.pill.prog{background:transparent;color:var(--ink2);border:1px solid var(--line);font-size:.68rem;padding:1px 7px;vertical-align:1px}
.pill.nov{background:var(--warn-bg);color:var(--warn);font-size:.68rem;padding:1px 7px;vertical-align:1px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.neu{background:var(--neu-bg);color:var(--ink2)}

/* hemiciclo */
.hemi{display:block;width:100%;max-width:520px;margin:6px auto 0;height:auto}
.hemi circle{stroke:var(--card);stroke-width:.6;cursor:pointer}
.sepia .hemi circle{stroke:var(--sepia)}
.hemi .big{font-family:var(--f-d);font-stretch:66%;font-weight:900;font-size:34px;fill:var(--ink)}
.hemi .cap{font-family:var(--f-d);font-size:9.5px;font-weight:600;fill:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.hemi.dim circle{opacity:.22} .hemi.dim circle.on{opacity:1}

/* barra de bloques */
.bbar{position:relative;display:flex;gap:2px;height:22px;margin-top:22px}
.bbar span{height:100%;min-width:2px;border-radius:2px;cursor:pointer}
.bbar .maj{position:absolute;top:-16px;bottom:-4px;width:0;border-left:2px dashed var(--ink);pointer-events:none}
.bbar .maj b{position:absolute;top:-4px;left:5px;font-family:var(--f-d);font-size:.7rem;font-weight:700;white-space:nowrap;color:var(--ink)}
.blocks{display:grid;gap:8px;margin-top:12px}
.block{border-left:4px solid var(--line);padding:2px 0 2px 10px}
.block b{font-family:var(--f-d);font-weight:800}
.block .n{float:right;font-size:1.15rem}
.block p{margin:2px 0 0;font-size:.9rem;color:var(--ink2)}

/* tabla de partidos */
.ptable{width:100%;border-collapse:collapse;margin-top:12px;font-family:var(--f-d)}
.ptable th{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}
.ptable th:first-child{text-align:left}
.ptable td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.ptable td:first-child{text-align:left}
.ptable td:not(:first-child),.ptable th{white-space:nowrap}
.ptable tr.click{cursor:pointer}
.ptable tr.click:hover td{background:var(--paper)}
.pn{display:flex;align-items:center;gap:8px;font-weight:700}
.pn small{font-weight:500;color:var(--muted);display:block;font-size:.74rem;line-height:1.2}
.ptable .n{font-size:1.2rem}
.bar{height:8px;border-radius:0 4px 4px 0;min-width:2px}
.barcell{width:34%}
.delta{font-size:.82rem;font-weight:700} .delta.up{color:var(--ok)} .delta.down{color:var(--bad)} .delta.eq{color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.tscroll::-webkit-scrollbar{height:6px}
.tscroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* alianzas */
.ali{display:grid;gap:10px;margin-top:12px}
.ali article{border-top:1px solid var(--line2);padding-top:10px}
.ali h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.ali p{margin:4px 0 0;color:var(--ink2);font-size:.95rem}
.coin{display:grid;gap:6px;margin-top:12px}
.coin .r{display:grid;grid-template-columns:92px 1fr 44px;gap:8px;align-items:center;font-family:var(--f-d);font-size:.86rem}
.coin .tr{background:var(--line2);border-radius:4px;height:10px;overflow:hidden}
.coin .tr i{display:block;height:100%;border-radius:0 4px 4px 0}

/* leyes */
.ley{background:var(--card);border:1px solid var(--line);border-radius:10px;border-left-width:5px}
.ley.aprobada{border-left-color:var(--ok)} .ley.rechazada{border-left-color:var(--bad)} .ley.decaida,.ley.sinvotar{border-left-color:var(--warn)}
.ley summary{list-style:none;cursor:pointer;padding:13px 14px;display:grid;gap:6px}
.ley summary::-webkit-details-marker{display:none}
.ley summary h3{font-size:1.02rem;font-weight:800;line-height:1.25}
.ley .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--f-d);font-size:.78rem;color:var(--muted)}
.ley .more{font-family:var(--f-d);font-size:.78rem;font-weight:700;color:var(--muted)}
.ley[open] .more .a{display:none} .ley:not([open]) .more .b{display:none}
.ley .body{padding:0 14px 14px;display:grid;gap:12px}
.ley h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.ley p{margin:0}
.votes{display:grid;gap:8px}
.vrow{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:start}
.vrow>b{font-family:var(--f-d);font-size:.8rem;padding-top:3px}
.pchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-family:var(--f-d);font-size:.78rem;font-weight:600;background:var(--card)}
.args{display:grid;gap:8px}
.args div{background:var(--paper);border-radius:8px;padding:8px 10px;font-size:.92rem}
.links{display:flex;flex-direction:column;gap:2px;font-family:var(--f-d);font-size:.78rem}

/* propuestas */
.prop{display:grid;gap:10px;margin-top:4px}
.prop article{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;border-top:5px solid var(--line)}
.prop h3{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:800}
.prop h3 small{font-weight:500;color:var(--muted);font-size:.8rem}
.prop ul{margin:8px 0 0;padding-left:18px;display:grid;gap:6px}
.prop h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:12px}

/* 29-N */
.count{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.count .n{font-size:3rem;line-height:.9}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.duo > div{min-width:0}
.duo .count .n{font-size:2.5rem}
.duo .count h2{font-size:1rem}
.duo .sub{margin:6px 0 0;font-family:var(--f-d);font-size:.8rem;color:var(--muted)}
.vb.pend .v{color:var(--muted);font-family:var(--f-d);font-size:.8rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.92rem}
.kv dt{font-family:var(--f-d);font-weight:700;color:var(--muted);font-size:.8rem;padding-top:2px}
.kv dd{margin:0}
.sum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px}
.sum .n{font-size:2.6rem;line-height:1}
.track{position:relative;height:14px;background:var(--line2);border-radius:4px;margin-top:20px}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--ink)}
.track .maj{position:absolute;top:-14px;bottom:-4px;border-left:2px dashed var(--ink)}
.track .maj b{position:absolute;top:-5px;left:5px;font-family:var(--f-d);font-size:.7rem;white-space:nowrap}
.vbars{display:grid;gap:9px;margin-top:12px}
.vb{display:grid;grid-template-columns:88px 1fr 92px;gap:8px;align-items:center;font-family:var(--f-d);font-size:.86rem}
.vb .tr{position:relative;height:12px}
.vb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;min-width:2px}
.vb .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.vb .v{text-align:right;font-variant-numeric:tabular-nums}
.ptable td small.ic{display:block;font-size:.66rem;font-weight:600;color:var(--muted);letter-spacing:0;line-height:1.1}
.ptable small.cisc{font-style:italic;white-space:nowrap}
.vb .tr em{position:absolute;left:0;top:-3px;bottom:-3px;border:1.5px dashed var(--muted);border-left:0;border-radius:0 5px 5px 0;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line2) 3px 5px)}
.vb .tr s{position:absolute;top:50%;height:6px;margin-top:-3px;box-sizing:border-box;min-width:4px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);background:linear-gradient(var(--ink),var(--ink)) center/100% 1.5px no-repeat;filter:drop-shadow(0 0 1px var(--card))}
.vb .v small{display:block;font-size:.68rem;font-weight:600;color:var(--muted);line-height:1.25;white-space:nowrap}
.vb .v small.c{font-style:italic}
.cistog{display:inline-flex;align-items:center;gap:6px}
.cistog i{width:16px;height:10px;border:1.5px dashed var(--muted);border-radius:2px;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line2) 3px 5px)}
.polls tr.avg td{background:var(--paper)}
.polls tr.avg td:first-child b{font-weight:800}
.polls tr.cisrow td{font-style:italic;color:var(--muted)}
.polls tr.out td{color:var(--muted)}
.part{margin-top:12px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);font-family:var(--f-d)}
.part .phead{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.part .phead span{font-size:.8rem;font-weight:700;color:var(--muted)}
.polls .pt{display:none} .polls td:first-child small.pt2{white-space:nowrap} .polls td small.pt2 b{color:var(--ink2)}

   a partir del resultado de 2023 y aplica D'Hondt con barrera del 3 %. */
function peModel(PROV, media) {
  var AND = '01', CAT = '09', VAL = '17', BAL = '04', CAN = '05';
  var codes = Object.keys(PROV), VT = 0;
  codes.forEach(function (c) { VT += PROV[c].V; });

  // base de cada candidatura de 2026 en cada provincia (a partir de 2023)
  var BASE = {
    PP: function (c) { return b(c, 'PP') + b(c, 'UPN'); },
    PSOE: function (c) { return b(c, 'PSOE'); },
    VOX: function (c) { return b(c, 'VOX'); },
    FA: function (c) { return b(c, 'SUMAR'); },
    PODEMOS: function (c) { var ca = PROV[c].ca; return (ca === CAT || ca === VAL || ca === BAL || ca === CAN) ? 0 : b(c, 'SUMAR'); },
    ADELANTE: function (c) { return PROV[c].ca === AND ? b(c, 'SUMAR') : 0; },
    ERC: function (c) { return b(c, 'ERC'); }, JUNTS: function (c) { return b(c, 'JUNTS'); },
    BILDU: function (c) { return b(c, 'BILDU'); }, PNV: function (c) { return b(c, 'PNV'); },
    BNG: function (c) { return b(c, 'BNG'); }, CC: function (c) { return b(c, 'CC'); },
    SALF: function () { return 1; }
  };
  var BLEND = { PP: 1, PSOE: 1, VOX: 1 };
  var est = {}, tot = {};
  codes.forEach(function (c) { est[c] = { v: {}, s: {} }; });
  Object.keys(BASE).forEach(function (k) {
    var T = media[k]; if (T == null) return;
    var B = 0; codes.forEach(function (c) { B += BASE[k](c) * PROV[c].V / VT; });
    if (B <= 0) return;
    codes.forEach(function (c) {
      var base = BASE[k](c), prop = base * T / B, v = prop;
      if (BLEND[k]) v = Math.max(0, 0.5 * prop + 0.5 * (base + (T - B)));
      if (base > 0 || k === 'SALF') est[c].v[k] = v;
    });
  });
  codes.forEach(function (c) {
    var e = est[c], sum = 0, k;
    for (k in e.v) sum += e.v[k];
    if (sum > 97) for (k in e.v) e.v[k] = e.v[k] * 97 / sum;
    // D'Hondt
    var q = [], n = PROV[c].e26;
    for (k in e.v) if (e.v[k] >= 3) for (var i = 1; i <= n; i++) q.push([e.v[k] / i, k]);
    q.sort(function (a, b2) { return b2[0] - a[0]; });

    var best = null; for (k in e.v) if (best === null || e.v[k] > e.v[best]) best = k; e.w = best;
  });
  return { prov: est, total: tot };
}

var TABS = XVI ? ['camaras','leyes','propuestas','mapa','sondeos'] : ['camaras','sondeos','leyes','propuestas','mapa'], RENDER = { camaras:renderCamaras, leyes:renderLeyes, sondeos:renderSondeos, propuestas:renderPropuestas, mapa:renderMapa, afinidad:renderAfinidad }, done = {};
// la pestaña Afinidad, detrás de Propuestas, cuando hay respuestas suficientes
if(afVisible()){ TABS.splice(TABS.indexOf('propuestas') + 1, 0, 'afinidad'); $('#t-afinidad').hidden = false; $('.tabs').classList.add('seis'); }
var TAB_ACT = null;
function go(tab, push){
  // #aprende y #aprende-l4: las lecciones, encima de la pestaña en la que se estaba
  if(tab && tab.indexOf('aprende') === 0){ aprende(tab.slice(8)); if(TAB_ACT) return; tab = 'camaras'; push = false; }
  else if(window.PE_APRENDE && PE_APRENDE.abierto()){ PE_APRENDE.alCerrar = null; PE_APRENDE.cerrar(); PE_APRENDE.alCerrar = finAprende; }
  // #test (el enlace que se comparte desde el test): Propuestas con el test abierto
  if(tab === 'test' && C.encuesta && TABS.indexOf('propuestas') >= 0){ go('propuestas', true); abrirTest(!!tGuardadas()); return; }
  if(TABS.indexOf(tab) < 0) tab = 'camaras';
  try{ if(window.peGC) peGC('pestana-' + tab, 'Pestaña ' + tab, true); }catch(e){}
  TABS.forEach(function(t){ $('#s-' + t).hidden = t !== tab; $('#t-' + t).setAttribute('aria-selected', t === tab); });
  if(!done[tab]){ RENDER[tab](); done[tab] = 1; }
  if(push && location.hash !== '#' + tab){ try{ history.replaceState(null, '', '#' + tab); }catch(e){ location.hash = tab; } }
  TAB_ACT = tab;
  hideTip();
}
// Aprende (aprende.js): se carga la primera vez que se abre
function aprende(l){
  try{ if(window.peGC) peGC('aprende' + (l ? '-' + l : ''), 'Aprende', true); }catch(e){}
  $$('dialog[open]').forEach(function(d){ d.close(); });
  var h = '#aprende' + (l ? '-' + l : ''); if(location.hash !== h){ try{ history.replaceState(null, '', h); }catch(e){} }
  function abre(){ PE_APRENDE.alCerrar = finAprende; PE_APRENDE.abrir(l || ''); }
  if(window.PE_APRENDE) return abre();
  var s = document.createElement('script'); s.src = 'aprende.js'; s.onload = abre; document.head.appendChild(s);
}
function finAprende(){ try{ history.replaceState(null, '', '#' + (TAB_ACT || 'camaras')); }catch(e){} $('#btnAprende').focus({preventScroll: true}); }
$$('.tab').forEach(function(b){ b.onclick = function(){ go(b.getAttribute('data-tab'), true); window.scrollTo(0, 0); }; });
window.addEventListener('hashchange', function(){ go(location.hash.slice(1)); });
document.addEventListener('click', function(e){ var a = e.target.closest && e.target.closest('a[href^="#"]'); if(a){ var t = a.getAttribute('href').slice(1); if(t.indexOf('aprende') === 0){ e.preventDefault(); aprende(t.slice(8)); return; } if(TABS.indexOf(t) >= 0){ e.preventDefault(); go(t, true); window.scrollTo(0, 0); } } });
$('#btnAyuda').onclick = function(){ renderAyuda(); $('#dlgAyuda').showModal(); };
$('#btnAprende').onclick = function(){ aprende(''); };
$$('dialog').forEach(function(d){ d.addEventListener('click', function(e){ if(e.target === d) d.close(); }); });

var dd = diasHasta(C.meta.eleccion);
$('#estado').textContent = XVI ? LEGS.XVI.n + ' · Cortes constituidas el ' + fecha(C.meta.constitucion) : (S.resultado ? 'Resultados del 29-N cargados' : dd > 0 ? 'Faltan ' + dd + (dd === 1 ? ' día' : ' días') + ' para las generales del 29-N' : dd === 0 ? 'Hoy se vota' : 'Elecciones celebradas el 29-N') + (VEDA ? ' · veda: sondeos congelados del ' : ' · sondeos del ') + fecha(S.actualizado);
if(VEDA && !XVI) $('#aviso').innerHTML = '<div class="card" style="margin-bottom:14px;border-left:4px solid var(--warn)"><p class="eyebrow">Veda electoral</p><p style="margin:4px 0 0">Desde el ' + fecha(VD.desde.slice(0, 10), 1) + ' hasta el cierre de los colegios, el domingo ' + fecha(VD.hasta.slice(0, 10), 1) + ' a las ' + esc(horaDe(VD.hasta)) + ', la ley electoral prohíbe publicar sondeos nuevos. Lo que ves en Intención, en el mapa y en las fichas de partido son los últimos sondeos publicados antes de la veda, del ' + fecha(S.actualizado, 1) + ', sin actualizar. A partir de esa hora se comparan con los resultados.</p><p class="src">' + link(VD.norma) + '.</p></div>';
// en la XVI Legislatura no hay pestaña de resultados: el 29-N ya está en Cámaras y en el Mapa
if(!XVI){
  if(window.PE_DEMO || Date.now() >= DIRECTO_DESDE) activarDirecto();
  else if(DIRECTO_DESDE - Date.now() < 2e9) setTimeout(activarDirecto, DIRECTO_DESDE - Date.now());
}
if(!store('pe-coach') && !DIRECTO){
  $('#coach').innerHTML = '<div class="coach" style="margin-bottom:14px"><span>Empieza por <b class="ui">Cámaras</b> para ver cómo está el Parlamento y ' + (XVI ? 'pasa a <b class="ui">Propuestas</b> para ver qué cumple cada partido de lo que prometió' : 'pasa a <b class="ui">Intención</b> para ver cómo cambiaría') + '. Casi todo se puede tocar, y el botón <b class="ui">Ayuda</b> explica cada sección y los términos.</span><button type="button" id="coachX">Entendido</button></div>';
  $('#coachX').onclick = function(){ $('#coach').innerHTML = ''; store('pe-coach', '1'); };
}
go(location.hash.slice(1) || (DIRECTO ? 'directo' : 'camaras'));
try{ var sy = sessionStorage.getItem('pe-scroll'); if(sy != null){ sessionStorage.removeItem('pe-scroll'); window.scrollTo(0, +sy); } }catch(e){}

/* ---------- cambios sin recargar a mano ----------
   1. Al empezar o acabar la veda, la página se recarga sola (se comprueba cada minuto y al volver a ella).
   2. La hora del servidor corrige la del dispositivo si está desajustada más de dos minutos.
   Al recargar se conservan la pestaña y el desplazamiento. */
function recargar(){
  try{ sessionStorage.setItem('pe-scroll', String(window.scrollY)); }catch(e){}
  // cache 'reload' renueva la copia del navegador para que la recarga use ya el archivo nuevo
  fetch('data/sondeos.js', { cache:'reload' }).catch(function(){}).then(function(){ location.reload(); });
}
function revisarVeda(){ if(vedaAhora() !== VEDA) recargar(); }
if(V0 && V1){
  setInterval(revisarVeda, 60000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) revisarVeda(); });
  fetch(location.pathname, { method:'HEAD', cache:'no-store' }).then(function(r){
    var sv = Date.parse(r.headers.get('Date') || ''); if(!sv) return;
    var d = sv - Date.now(); store('pe-desfase', String(Math.abs(d) > 120000 ? Math.round(d) : 0)); revisarVeda();
  }).catch(function(){});
}
})();
</script>
<script>
(function(){
  var KEY = 'pe-dispositivo', yo = null, m = location.search.match(/[?&]yo=([a-z0-9-]+)/i);
  try{
    if(m){ if(m[1].toLowerCase() === 'nadie') localStorage.removeItem(KEY); else localStorage.setItem(KEY, m[1].toLowerCase());
      history.replaceState(null, '', location.pathname + location.hash); }
    yo = localStorage.getItem(KEY);
  }catch(e){}
  window.peGC = function(path, title, event){
    if(!window.goatcounter || !window.goatcounter.count) return;
    if(yo){ path = 'yo-' + yo + '/' + String(path).replace(/^\//, ''); title = '[Yo · ' + yo + '] ' + title; }
    window.goatcounter.count({ path: path, title: title, event: !!event });
  };
})();
</script>
<script>
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
<script data-goatcounter="https://politica176.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="//gc.zgo.at/count.js" onload="peGC(location.pathname, document.title)"></script>
